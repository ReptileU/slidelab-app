<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>SlideLab</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23111'/%3E%3Ctext x='29' y='46' font-family='Arial,sans-serif' font-weight='800' font-size='40' fill='%23e5e5ea' text-anchor='middle'%3ES%3C/text%3E%3Ccircle cx='47' cy='43' r='3.5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // Если приложение упадёт до или во время запуска — показываем причину на экране
      // и отправляем её на сервер, а не оставляем пустой экран.
      (function () {
        function report(message) {
          try {
            var root = document.getElementById("root");
            if (root && !root.childElementCount) {
              root.innerHTML =
                '<div style="padding:24px;font:15px -apple-system,sans-serif;color:#888;white-space:pre-wrap">' +
                "SlideLab не запустился.\n\n" + String(message).replace(/</g, "&lt;") + "</div>";
            }
            var tg = window.Telegram && window.Telegram.WebApp;
            fetch("./api/client-errors", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                message: String(message).slice(0, 2000),
                ua: navigator.userAgent,
                tg_version: tg ? tg.version : null,
                platform: tg ? tg.platform : null,
                url: location.href.slice(0, 300),
              }),
            });
          } catch (e) {}
        }
        window.addEventListener("error", function (e) {
          report((e.error && e.error.stack) || e.message);
        });
        window.addEventListener("unhandledrejection", function (e) {
          report((e.reason && e.reason.stack) || e.reason);
        });
        window.__slReport = report;
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
