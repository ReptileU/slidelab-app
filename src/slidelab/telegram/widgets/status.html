<div class=w id=w></div>
<style>
.w{font:15px/1.3 system-ui,sans-serif;color:var(--tg-theme-text-color,#fff);padding:14px 16px 14px 20px}
.n{font-weight:800;font-size:19px}
.t{opacity:.6;font-size:13px;margin:3px 0 12px}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar i{height:5px;border-radius:3px;background:rgba(127,127,127,.25);position:relative;overflow:hidden}
.bar i.on{background:var(--tg-theme-button-color,#fff)}
.bar i.now:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:m 1.6s infinite}
@keyframes m{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.lb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;margin-top:6px;opacity:.5}
.lb b{font-weight:600}.lb b.on{opacity:1;color:var(--tg-theme-text-color,#fff)}
.c{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,rgba(127,127,127,.16))}
.c b{display:block;font-size:15px}.c span{font-size:13px;opacity:.65}
.x{color:#ff453a}
</style>
<script>
const W=window.TelegramWidget,T=__T__;
function r(){let d={};try{d=JSON.parse(W.chatData||'{}')}catch(e){}
const s=d.s??0,x=s<0;let h='<div class=n>'+T.no.replace('#','#'+(d.n||''))+'</div><div class=t>'+(d.t||'')+(d.p?' · '+d.p:'')+'</div>';
h+='<div class=bar>'+T.steps.map((_,i)=>'<i class="'+(!x&&i<=s?'on':'')+(!x&&i==s&&s<3?' now':'')+'"></i>').join('')+'</div>';
h+='<div class=lb>'+T.steps.map((t,i)=>'<b class="'+(!x&&i<=s?'on':'')+'">'+t+'</b>').join('')+'</div>';
h+='<div class=c><b class="'+(x?'x':'')+'">'+(d.h||'')+'</b><span>'+(d.d||'')+'</span></div>';
document.getElementById('w').innerHTML=h}
W.onEvent('chatDataChanged',r);r();W.ready()
</script>
