[project]
name = "slidelab"
version = "0.1.0"
description = "SlideLab: Telegram-бот (aiogram 3), API для Mini App (FastAPI) и общее ядро"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "arq>=0.26",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidelab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.ruff.lint.per-file-ignores]
# Тексты интерфейса и FAQ — длинные строки здесь нормальны
"src/slidelab/core/i18n/*.py" = ["E501"]
"src/slidelab/core/seed_faq.py" = ["E501"]
"src/slidelab/core/seed_showcase.py" = ["E501"]
# Перенесён из прежнего бота как есть
"src/slidelab/bot/publisher.py" = ["SIM105", "SIM117", "RUF005", "B007"]
# Сигнатуры заданы базовым классом aiogram
"tests/fakes.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Публикация постов перенесена из прежнего бота как есть — типизируется отдельно
module = "slidelab.bot.publisher"
ignore_errors = true
