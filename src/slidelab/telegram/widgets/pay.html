<div class=w id=w></div>
<style>
.w{--t:var(--tg-theme-text-color,#f5f5f7);--h:var(--tg-theme-hint-color,#8e8e93);--c:rgba(255,255,255,.08);--cb:rgba(255,255,255,.1);--on:linear-gradient(180deg,#fff,#e5e5ea);--ont:#000;font:15px/1.3 system-ui,sans-serif;color:var(--t);padding:12px 14px 4px 20px}
@media (prefers-color-scheme:light){.w{--c:rgba(0,0,0,.05);--cb:rgba(0,0,0,.08);--on:linear-gradient(180deg,#3a3a3c,#000);--ont:#fff}}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--h)}
.ti{font-weight:700;font-size:17px;margin-top:2px}
.a{font-weight:800;font-size:28px;margin:4px 0 2px}
.hi{font-size:12px;color:var(--h);margin-bottom:6px}
.l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--h);margin:12px 2px 6px}
.cd{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--cb);background:var(--c);color:var(--t);border-radius:14px;padding:10px 12px;margin-bottom:6px;text-align:left;font:inherit}
.ic{flex:0 0 34px;height:24px;border-radius:5px;background:linear-gradient(135deg,#3a3a3c,#111);position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.ic:after{content:'';position:absolute;left:5px;top:7px;width:8px;height:6px;border-radius:1.5px;background:#c7c7cc}
.cd b{display:block;font-size:13px;font-weight:600}
.cd span{display:block;font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.02em;margin-top:1px;white-space:nowrap}
.cd div{min-width:0;flex:1}
.cp{margin-left:auto;font-size:17px;color:var(--h);font-style:normal;flex:0 0 auto}
.cp.ok{color:#34c759;font-weight:600}
.nm{font-size:13px;color:var(--h);margin:4px 2px 0}
.go{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;padding:13px;font:700 16px system-ui;background:var(--on);color:var(--ont)}
.go.wait{opacity:.6}
.m{margin-top:12px;padding:12px;border-radius:12px;background:var(--c);border:1px solid var(--cb);font-weight:600;text-align:center}
.m.ok{color:#34c759}
.e{color:#ff453a;font-size:12px;text-align:center;margin-top:6px}
.e:empty{display:none}
</style>
<script>
const W=window.TelegramWidget,T=__T__;let busy=0,err='',copied=-1,tm=0;
const D=()=>{try{return JSON.parse(W.chatData||'{}')}catch(e){return{}}};
const g=n=>String(n).replace(/\D/g,'').replace(/(\d{4})(?=\d)/g,'$1 ');
function r(){const d=D(),cs=d.cs||[];let h='<div class=k>'+T.pay+'</div><div class=ti>'+(d.t||'')+'</div><div class=a>'+(d.a||'')+'</div>';
if(d.h)h+='<div class=hi>'+d.h+'</div>';
if(!d.st){h+='<div class=l>'+T.cards+'</div>'+cs.map((c,i)=>'<button class=cd data-i='+i+'><i class=ic></i><div><b>'+c[0]+'</b><span>'+g(c[1])+'</span></div><em class="cp'+(copied==i?' ok':'')+'">'+(copied==i?'✓':'⧉')+'</em></button>').join('');
if(d.n)h+='<div class=nm>'+T.to+' '+d.n+'</div>';
h+='<button class="go'+(busy?' wait':'')+'" id=go>'+(busy?T.wait:T.paid)+'</button><div class=e>'+err+'</div>'}
else h+='<div class="m'+(d.st>1?' ok':'')+'">'+[0,T.s1,T.s2,T.s3][d.st]+'</div>';
document.getElementById('w').innerHTML=h}
document.getElementById('w').addEventListener('click',e=>{let b=e.target;while(b&&b.tagName!='BUTTON')b=b.parentElement;if(!b)return;const d=D();
if(b.id=='go'){if(busy||d.st)return;busy=1;err='';W.HapticFeedback&&W.HapticFeedback.impactOccurred('medium');
W.request('p:'+(d.k||'')+':'+(d.r||'')+':'+(d.c||0)).then(()=>{busy=0;r()},()=>{busy=0;err=T.err;r()});r();return}
const i=+b.dataset.i,c=(d.cs||[])[i];if(!c)return;W.copyText(String(c[1]).replace(/\D/g,''));W.HapticFeedback&&W.HapticFeedback.notificationOccurred('success');
copied=i;clearTimeout(tm);tm=setTimeout(()=>{copied=-1;r()},1800);r()});
W.onEvent('chatDataChanged',r);r();W.ready()
</script>
