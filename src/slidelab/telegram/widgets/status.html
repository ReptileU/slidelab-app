<div class=w id=w></div>
<style>
.w{--t:var(--tg-theme-text-color,#f5f5f7);--h:var(--tg-theme-hint-color,#8e8e93);--c:rgba(255,255,255,.08);--cb:rgba(255,255,255,.1);--bar:linear-gradient(90deg,#c7c7cc,#fff);--off:rgba(255,255,255,.14);font:15px/1.3 system-ui,sans-serif;color:var(--t);padding:12px 14px 4px 20px}
@media (prefers-color-scheme:light){.w{--c:rgba(0,0,0,.05);--cb:rgba(0,0,0,.08);--bar:linear-gradient(90deg,#3a3a3c,#000);--off:rgba(0,0,0,.1)}}
.n{font-weight:800;font-size:19px}
.t{color:var(--h);font-size:13px;margin:3px 0 12px}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar i{height:5px;border-radius:3px;background:var(--off);position:relative;overflow:hidden}
.bar i.on{background:var(--bar)}
.bar i.now:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(127,127,127,.5),transparent);animation:m 1.6s infinite}
@keyframes m{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.lb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;margin-top:6px;color:var(--h)}
.lb b{font-weight:600}.lb b.on{color:var(--t)}
.c{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--c);border:1px solid var(--cb)}
.c b{display:block;font-size:15px}.c span{font-size:13px;color:var(--h)}
.x{color:#ff453a}
</style>
<script>
const W=window.TelegramWidget,T=__T__;
function r(){let d={};try{d=JSON.parse(W.chatData||'{}')}catch(e){}
const s=d.s??0,x=s<0;let h='<div class=n>'+T.no.replace('#','#'+(d.n||''))+'</div><div class=t>'+(d.t||'')+(d.p?' · '+d.p:'')+'</div>';
h+='<div class=bar>'+T.steps.map((_,i)=>'<i class="'+(!x&&i<=s?'on':'')+(!x&&i==s&&s<3?' now':'')+'"></i>').join('')+'</div>';
h+='<div class=lb>'+T.steps.map((t,i)=>'<b class="'+(!x&&i<=s?'on':'')+'">'+t+'</b>').join('')+'</div>';
h+='<div class=c><b class="'+(x?'x':'')+'">'+(d.h||'')+'</b><span>'+(d.d||'')+'</span></div>';
document.getElementById('w').innerHTML=h}
W.onEvent('chatDataChanged',r);r();W.ready()
</script>
