<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SlideLab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; padding: 32px 24px; box-sizing: border-box;
    background: radial-gradient(110% 60% at 50% -10%, #2c2c2e 0%, #0a0a0a 55%, #000 100%); }
  .box { max-width: 420px; width: 100%; text-align: center; }
  .ic { width: 88px; height: 88px; margin: 0 auto 28px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #3a3a3c, #000); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.22), 0 0 0 1px rgba(255,255,255,.1);
    font-weight: 800; font-size: 54px; position: relative; }
  .ic i { position: absolute; right: 7px; bottom: 7px; width: 24px; height: 24px; border-radius: 50%; background: #e8e8ed; display: flex; align-items: center; justify-content: center; }
  .ic i svg { width: 17px; height: 17px; margin-left: 1px; }
  .sil { background: linear-gradient(100deg, #8e8e93 0%, #f5f5f7 22%, #9a9a9f 42%, #fff 58%, #a1a1a6 76%, #f5f5f7 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; }
  p { margin: 0 0 28px; font-size: 16px; line-height: 1.5; color: rgba(245,245,247,.6); }
  button { width: 100%; border: 0; border-radius: 999px; padding: 16px; font: 600 17px inherit; font-family: inherit; color: #000; cursor: pointer;
    background: linear-gradient(180deg, #fff 0%, #e8e8ed 55%, #c7c7cc 100%); box-shadow: inset 0 1px 0 #fff; }
  .wait h1, .wait p, .wait button, .wait small { visibility: hidden; }
  .wait .ic { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  small { display: block; margin-top: 18px; font-size: 13px; color: rgba(245,245,247,.4); }
</style>
</head>
<body>
<div class="box wait">
  <div class="ic"><span class="sil">S</span><i><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></i></div>
  <h1 id="t">SlideLab обновился</h1>
  <p id="d">Новое приложение открывается кнопкой «SlideLab» слева от поля ввода в чате с ботом.</p>
  <button id="b">Перейти в бот</button>
  <small>@slidelab_order_bot</small>
</div>
<script>
  // Прежняя витрина больше не используется: эта страница только ведёт в бот к новому приложению.
  const tg = window.Telegram && window.Telegram.WebApp;
  const BOT = "https://t.me/slidelab_order_bot";
  const L = {
    uz: ["SlideLab yangilandi", "Yangi ilova bot chatidagi kiritish maydoni chap tomonidagi «SlideLab» tugmasi bilan ochiladi.", "Botga o‘tish"],
    en: ["SlideLab has been updated", "The new app opens with the “SlideLab” button next to the message field in the bot chat.", "Open the bot"],
  };
  const code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "";
  const tr = code.startsWith("uz") ? L.uz : code.startsWith("en") ? L.en : null;
  if (tr) { document.getElementById("t").textContent = tr[0]; document.getElementById("d").textContent = tr[1]; document.getElementById("b").textContent = tr[2]; }
  try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor("#000000"); tg.setBackgroundColor("#000000"); } } catch (e) {}
  // Кнопка «Открыть»: новое приложение работает по временной ссылке, бот при запуске пишет её в app.json.
  // Читаем её и сразу переходим, сохраняя данные Telegram (#tgWebAppData…). Не вышло — ведём в чат с ботом.
  const box = document.querySelector(".box");
  function fallback() {
    box.classList.remove("wait");
    if (tg && tg.initData) {
      try { tg.openTelegramLink(BOT + "?start=app"); setTimeout(() => tg.close(), 400); } catch (e) {}
    }
  }
  function timeout(ms) { return new Promise((_, no) => setTimeout(() => no(new Error("timeout")), ms)); }
  async function readLink() {
    const sources = [
      ["https://api.github.com/repos/ReptileU/slidelab-app/contents/app.json?ref=main", { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" }],
      ["./app.json?t=" + Date.now(), { cache: "no-store" }],
    ];
    for (const [src, opts] of sources) {
      try {
        const r = await Promise.race([fetch(src, opts), timeout(4000)]);
        if (!r.ok) continue;
        const data = await r.json();
        if (data && typeof data.url === "string" && data.url.startsWith("https://")) return data.url;
      } catch (e) {}
    }
    return null;
  }
  readLink().then((url) => {
    if (!url) return fallback();
    const target = new URL(url);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.toString());
  });
  document.getElementById("b").onclick = () => {
    if (tg && tg.openTelegramLink) { tg.openTelegramLink(BOT); setTimeout(() => tg.close(), 300); }
    else { location.href = BOT; }
  };
</script>
</body>
</html>
