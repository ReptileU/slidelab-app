<div class=w id=w></div>
<style>
.w{font:15px/1.3 system-ui,sans-serif;color:var(--tg-theme-text-color,#fff);padding:14px 16px 10px 20px}
.h{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;margin-bottom:10px}
.lg{position:relative;width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#3a3a3c,#000);color:#e5e5ea;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.lg i{position:absolute;right:2px;bottom:2px;width:9px;height:9px;border-radius:50%;background:#e8e8ed;color:#000;font:800 8px/9px system-ui;text-align:center;font-style:normal}
.l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin:10px 2px 5px}
.g{display:flex;gap:6px;flex-wrap:wrap}
.b{flex:1 1 0;min-width:64px;border:0;border-radius:12px;padding:8px 6px;background:var(--tg-theme-secondary-bg-color,rgba(127,127,127,.16));color:inherit;font:600 13px system-ui;text-align:center}
.b small{display:block;font-weight:500;font-size:11px;opacity:.6;margin-top:2px}
.b.on{background:var(--tg-theme-button-color,#fff);color:var(--tg-theme-button-text-color,#000)}
.b.on small{opacity:.75}
.b.off{opacity:.35}
.c{flex:0 0 auto;min-width:0;padding:7px 11px;border-radius:999px}
.go{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;font:700 16px system-ui;background:var(--tg-theme-button-color,#fff);color:var(--tg-theme-button-text-color,#000)}
.go s{color:#ff453a;font-weight:600;margin-right:6px}
.go.wait{opacity:.6}
.m{margin-top:12px;padding:12px;border-radius:12px;background:var(--tg-theme-secondary-bg-color,rgba(127,127,127,.16));font-weight:600;text-align:center}
.e{color:#ff453a;font-size:12px;text-align:center;margin-top:6px;min-height:15px}
</style>
<script>
const W=window.TelegramWidget,T=__T__,K='sl';
let S={s:0,d:1,l:T.lang,x:[0,0,0]},busy=0,err='';
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const D=()=>{try{return JSON.parse(W.chatData||'{}')}catch(e){return{}}};
const f=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function idx(){return S.s*12+S.d*4+S.x[0]*2+S.x[1]}
function seg(k,list){return '<div class=g>'+list.map((t,i)=>{let sub='',off='';if(k=='s'){const q=D().q||[];sub='<small>'+(q[i*12+4]>=0?f(q[i*12+4]):'')+'</small>'}if(k=='d'&&i==0&&S.s==2)off=' off';return '<button class="b'+(S[k]==i?' on':'')+off+'" data-k='+k+' data-v='+i+'>'+t+sub+'</button>'}).join('')+'</div>'}
function r(){const d=D(),q=d.q||[],o=d.o||[];if(S.s==2&&S.d==0)S.d=1;
let h='<div class=h><span class=lg>S<i>›</i></span>'+T.title+'</div>';
h+='<div class=l>'+T.vol+'</div>'+seg('s',T.vols)+'<div class=l>'+T.dl+'</div>'+seg('d',T.dls)+'<div class=l>'+T.lng+'</div>'+seg('l',T.lngs);
h+='<div class=l>'+T.ext+'</div><div class=g>'+T.xs.map((t,i)=>'<button class="b c'+(S.x[i]?' on':'')+'" data-k=x data-v='+i+'>'+t+'</button>').join('')+'</div>';
if(d.st==1)h+='<div class=m>'+T.ask+'</div>';
else if(d.st==2)h+='<div class=m>'+T.done.replace('#','#'+d.id)+'</div>';
else{const p=q[idx()],old=o[idx()];h+='<button class="go'+(busy?' wait':'')+'" id=go>'+(busy?T.wait:T.order+' · '+(old?'<s>'+f(old)+'</s>':'')+(p>0?f(p)+' '+T.sum:p==0?T.pack:''))+'</button><div class=e>'+err+'</div>'}
document.getElementById('w').innerHTML=h}
document.getElementById('w').addEventListener('click',e=>{let b=e.target;while(b&&b.tagName!='BUTTON')b=b.parentElement;if(!b)return;const d=D();
if(b.id=='go'){if(busy||d.st)return;busy=1;err='';W.HapticFeedback&&W.HapticFeedback.impactOccurred('medium');
W.request('o:'+S.s+S.d+S.l+(S.x[0]+S.x[1]*2+S.x[2]*4)).then(()=>{busy=0;r()},x=>{busy=0;err=T.err;r()});r();return}
if(d.st)return;const k=b.dataset.k,v=+b.dataset.v;if(k=='x')S.x[v]=S.x[v]?0:1;else{if(k=='d'&&v==0&&S.s==2)return;S[k]=v}
W.HapticFeedback&&W.HapticFeedback.selectionChanged();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}r()});
W.onEvent('chatDataChanged',r);r();W.ready()
</script>
